<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The ShiftTech wordmark beside a flat stack of three layered cards, with the tagline Software that runs your business.">
  <rect width="800" height="500" fill="#0C2B24"/>

  <!-- Same dashed inset frame and lime corner nodes as the category covers. -->
  <g stroke="rgba(244,242,234,.5)" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round">
    <line x1="16" y1="42" x2="784" y2="42"/>
    <line x1="16" y1="458" x2="784" y2="458"/>
    <line x1="42" y1="16" x2="42" y2="484"/>
    <line x1="758" y1="16" x2="758" y2="484"/>
  </g>
  <g fill="#74B812">
    <circle cx="42" cy="42" r="7"/>
    <circle cx="758" cy="42" r="7"/>
    <circle cx="42" cy="458" r="7"/>
    <circle cx="758" cy="458" r="7"/>
  </g>

  <!-- Left: a flat stack of three cards, back to front. No isometric depth or
       gradients, just offset flat rects, in keeping with the rest of the site. -->
  <g>
    <rect x="96" y="146" width="196" height="132" rx="6" fill="none" stroke="rgba(244,242,234,.35)" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="96" cy="146" r="4" fill="#74B812"/>

    <rect x="128" y="184" width="196" height="132" rx="6" fill="rgba(244,242,234,.1)" stroke="rgba(244,242,234,.5)" stroke-width="2"/>
    <circle cx="128" cy="184" r="4" fill="#74B812"/>

    <rect x="160" y="222" width="196" height="132" rx="6" fill="rgba(116,184,18,.14)" stroke="#74B812" stroke-width="2.5"/>
    <rect x="160" y="222" width="5" height="132" fill="#74B812"/>
    <circle cx="160" cy="222" r="4" fill="#74B812"/>
    <g fill="rgba(244,242,234,.6)">
      <rect x="184" y="252" width="120" height="11" rx="2"/>
      <rect x="184" y="276" width="82" height="11" rx="2"/>
    </g>
  </g>

  <!-- Right: wordmark, matching the O-mark / Shift / Tech treatment used
       sitewide, plus the standing tagline. -->
  <g font-family="Instrument Sans, ui-sans-serif, system-ui, sans-serif">
    <text x="446" y="205" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="15" font-weight="600" letter-spacing="2" fill="#74B812">// PROCESS</text>

    <circle cx="464" cy="272" r="27" fill="none" stroke="#74B812" stroke-width="11" stroke-dasharray="142 40" stroke-linecap="round" transform="rotate(-35 464 272)"/>
    <text x="502" y="288" font-size="60" font-weight="700" letter-spacing="-.5" fill="#F4F2EA">Shift<tspan fill="#74B812">Tech</tspan></text>

    <text x="446" y="340" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="14.5" letter-spacing="1.5" fill="rgba(244,242,234,.55)">SOFTWARE THAT RUNS YOUR BUSINESS</text>
  </g>
</svg>
